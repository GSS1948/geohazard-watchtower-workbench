name: Watchtower 6-Hour Cloud Scan

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-watchtower-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Execute 6-Hour Multi-Physics & TOC Scan
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          python scheduler_agent.py

      - name: Archive Generated CAP v1.2 Alerts
        run: |
          mkdir -p alerts_archive
          if [ -n "$(ls -A alerts_archive 2>/dev/null)" ]; then
            git config user.name "Watchtower Cloud Bot"
            git config user.email "actions@github.com"
            git add alerts_archive/
            git diff --staged --quiet || git commit -m "chore: archive automated CAP v1.2 alerts"
            git push
          else
            echo "No new CAP alerts generated during this scan."
          fi
