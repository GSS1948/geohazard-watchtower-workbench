name: Watchtower 6-Hour Cloud Scan

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Also lets you trigger a scan anytime with a single button click
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-watchtower-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Watchtower Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy requests

      - name: Execute 6-Hour Multi-Physics & TOC Scan
        run: python scheduler_agent.py

      - name: Archive Generated CAP v1.2 Alerts
        run: |
          git config user.name "Watchtower Cloud Bot"
          git config user.email "actions@github.com"
          git add alerts_archive/
          git diff --staged --quiet || git commit -m "chore: archive automated CAP v1.2 alerts"
          git push
